[project]
name = "multi-agent-customer-service-system-aws"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.89",
    "botocore>=1.43.89",
    "python-dotenv>=1.2.3",
    "strands-agents>=1.55.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "boto3-stubs[essential]>=1.43.89",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true